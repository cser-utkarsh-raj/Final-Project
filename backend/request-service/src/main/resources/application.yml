server:
  port: 8083

spring:
  application:
    name: request-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:requestdb}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

inventory-service:
  url: ${INVENTORY_SERVICE_URL:http://localhost:8082}

jwt:
  secret: ${JWT_SECRET:stationery-management-local-secret-key-that-is-long-enough-for-hmac}
