server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://127.0.0.1:8081}
          predicates:
            - Path=/api/auth/**

        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://127.0.0.1:8082}
          predicates:
            - Path=/api/items/**

        - id: request-service
          uri: ${REQUEST_SERVICE_URL:http://127.0.0.1:8083}
          predicates:
            - Path=/api/requests/**

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://127.0.0.1:8761/eureka/}